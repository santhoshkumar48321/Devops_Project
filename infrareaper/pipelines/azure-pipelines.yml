# ============================================================
# InfraReaper CI/CD Multi-Stage Pipeline (Azure DevOps)
# ============================================================
# Hardened, enterprise-grade multi-stage CI/CD pipeline executing
# on the self-hosted lab agent (infrareaper-lab-agent).
#
# Pipeline Architecture:
#   Stage 1: Lint & Code Validation (ShellCheck, Hadolint, Yamllint, Terraform, K8s, Unit Tests)
#   Stage 2: Security & IaC Scanning (Trivy K8s, Trivy Terraform, Secrets)
#   Stage 3: Terraform Infrastructure Provisioning (AKS, ACR, Key Vault, RGs)
#   Stage 4: Container Build & Vulnerability Scan (Docker build, Trivy image scan, ACR push)
#   Stage 5: Continuous Deployment to AKS (Kustomize overlays, Key Vault secret sync)
#   Stage 6: Live Smoke Test Verification (Trigger on-demand AKS Job, stream logs, assert health)
# ============================================================

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - infrareaper/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - infrareaper/**

pool:
  name: Default
  demands:
    - Agent.Name -equals infrareaper-lab-agent

variables:
  - name: ACR_NAME
    value: "infrareaperacrpalwa"
  - name: ACR_LOGIN_SERVER
    value: "infrareaperacrpalwa.azurecr.io"
  - name: IMAGE_REPOSITORY
    value: "infrareaper-scanner"
  - name: AKS_CLUSTER_NAME
    value: "infrareaper-aks"
  - name: AKS_RESOURCE_GROUP
    value: "infrareaper-core-rg"
  - name: KEYVAULT_NAME
    value: "infrareaperkv-k9r9y"
  - name: KUBE_NAMESPACE
    value: "infrareaper"
  - name: WORKING_DIR
    value: "$(Build.SourcesDirectory)/infrareaper"
  - name: TERRAFORM_DIR
    value: "terraform/environments/dev"

stages:
  # Stage 1: Static analysis, linting and unit tests
  - template: templates/lint-stage.yml
    parameters:
      workingDirectory: $(WORKING_DIR)

  # Stage 2: CIS benchmark, IaC security & secret leakage scan
  - template: templates/security-stage.yml
    parameters:
      workingDirectory: $(WORKING_DIR)

  # Stage 3: Infrastructure Provisioning using Terraform
  - template: templates/terraform-stage.yml
    parameters:
      workingDirectory: $(WORKING_DIR)
      terraformDir: $(TERRAFORM_DIR)
      environment: "dev"
      autoApprove: true

  # Stage 4: Container Build, Trivy scanning and ACR Push
  - template: templates/build-stage.yml
    parameters:
      workingDirectory: $(WORKING_DIR)
      acrName: $(ACR_NAME)
      acrLoginServer: $(ACR_LOGIN_SERVER)
      imageRepository: $(IMAGE_REPOSITORY)
      imageTag: $(Build.BuildId)

  # Stage 5: Deploy K8s manifests, sync Key Vault secrets, deploy Prometheus/Grafana
  - template: templates/deploy-stage.yml
    parameters:
      workingDirectory: $(WORKING_DIR)
      aksClusterName: $(AKS_CLUSTER_NAME)
      aksResourceGroup: $(AKS_RESOURCE_GROUP)
      keyVaultName: $(KEYVAULT_NAME)
      kubeNamespace: $(KUBE_NAMESPACE)
      overlay: "dev"

  # Stage 6: Automated Smoke Test validation on AKS
  - template: templates/smoke-test-stage.yml
    parameters:
      aksClusterName: $(AKS_CLUSTER_NAME)
      aksResourceGroup: $(AKS_RESOURCE_GROUP)
      kubeNamespace: $(KUBE_NAMESPACE)
      timeoutSeconds: 240
