# ============================================================
# Stage Template: Deploy to AKS
# ============================================================
# Authenticates with AKS, applies Kustomize overlays, and
# synchronizes credentials from Key Vault into Kubernetes Secrets.
# ============================================================

parameters:
  - name: workingDirectory
    type: string
    default: "$(Build.SourcesDirectory)/infrareaper"
  - name: aksClusterName
    type: string
    default: "infrareaper-aks"
  - name: aksResourceGroup
    type: string
    default: "infrareaper-core-rg"
  - name: keyVaultName
    type: string
    default: "infrareaperkv-k9r9y"
  - name: kubeNamespace
    type: string
    default: "infrareaper"
  - name: overlay
    type: string
    default: "dev"

stages:
  - stage: Deploy_AKS
    displayName: "Deploy to AKS (${{ parameters.overlay }})"
    dependsOn: Build_and_Scan_Image
    condition: and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.Reason'], 'Manual'), contains(variables['Build.SourceBranch'], 'phase')))
    jobs:
      - job: Deploy_K8s_Manifests
        displayName: "Deploy K8s Overlays"
        pool:
          name: Default
          demands:
            - Agent.Name -equals infrareaper-lab-agent
        steps:
          - checkout: self
            fetchDepth: 1

          - script: |
              echo "=== Step 1: Connect to AKS Cluster ==="
              az aks get-credentials \
                --resource-group "${{ parameters.aksResourceGroup }}" \
                --name "${{ parameters.aksClusterName }}" \
                --overwrite-existing
              kubectl get nodes

              # Ensure ACR is attached to AKS for native image pulling
              ACTUAL_ACR=$(az acr list --resource-group "${{ parameters.aksResourceGroup }}" --query "[0].name" -o tsv 2>/dev/null || az acr list --query "[0].name" -o tsv 2>/dev/null || true)
              if [ -n "$ACTUAL_ACR" ]; then
                echo "Checking if AKS cluster '${{ parameters.aksClusterName }}' has AcrPull on ACR '$ACTUAL_ACR'..."
                KUBELET_ID=$(az aks show -g "${{ parameters.aksResourceGroup }}" -n "${{ parameters.aksClusterName }}" --query "identityProfile.kubeletidentity.objectId" -o tsv 2>/dev/null || true)
                ACR_ID=$(az acr show --name "$ACTUAL_ACR" --query id -o tsv 2>/dev/null || true)
                HAS_ROLE=""
                if [ -n "$KUBELET_ID" ] && [ -n "$ACR_ID" ]; then
                  HAS_ROLE=$(az role assignment list --assignee "$KUBELET_ID" --scope "$ACR_ID" --query "[?roleDefinitionName=='AcrPull'].id" -o tsv 2>/dev/null || true)
                fi
                if [ -z "$HAS_ROLE" ]; then
                  echo "Attaching ACR '$ACTUAL_ACR' to AKS cluster '${{ parameters.aksClusterName }}'..."
                  az aks update \
                    --resource-group "${{ parameters.aksResourceGroup }}" \
                    --name "${{ parameters.aksClusterName }}" \
                    --attach-acr "$ACTUAL_ACR" \
                    --output none 2>/dev/null || true
                else
                  echo "AcrPull role already verified on ACR '$ACTUAL_ACR'."
                fi
              fi
            displayName: "Connect kubectl to AKS & Verify ACR Attachment"

          - script: |
              echo "=== Step 2: Ensure Namespace & Apply Kustomize Overlay (${{ parameters.overlay }}) ==="
              # Discover actual ACR and Login Server
              ACTUAL_ACR=$(az acr list --resource-group "${{ parameters.aksResourceGroup }}" --query "[0].name" -o tsv 2>/dev/null || az acr list --query "[0].name" -o tsv 2>/dev/null || true)
              LOGIN_SERVER=$(az acr show --name "$ACTUAL_ACR" --query loginServer -o tsv 2>/dev/null || true)

              if [ -n "$LOGIN_SERVER" ]; then
                echo "Updating K8s manifests with active ACR login server: $LOGIN_SERVER..."
                sed -i -E "s|[a-zA-Z0-9]+\.azurecr\.io/infrareaper-scanner|${LOGIN_SERVER}/infrareaper-scanner|g" kubernetes/base/cronjob.yaml
                sed -i -E "s|[a-zA-Z0-9]+\.azurecr\.io/infrareaper-scanner|${LOGIN_SERVER}/infrareaper-scanner|g" "kubernetes/overlays/${{ parameters.overlay }}/kustomization.yaml"
              fi

              kubectl create namespace "${{ parameters.kubeNamespace }}" --dry-run=client -o yaml | kubectl apply -f -
              kubectl apply -k "kubernetes/overlays/${{ parameters.overlay }}/"

              if [ -n "$LOGIN_SERVER" ]; then
                echo "Setting CronJob image to ${LOGIN_SERVER}/infrareaper-scanner:dev..."
                kubectl set image cronjob/infrareaper-scanner "scanner=${LOGIN_SERVER}/infrareaper-scanner:dev" -n "${{ parameters.kubeNamespace }}"
              fi
            workingDirectory: ${{ parameters.workingDirectory }}
            displayName: "Apply Kustomize Overlay"

          - script: |
              echo "=== Step 3: Synchronize Secrets from Key Vault ==="
              VAULT_NAME="${{ parameters.keyVaultName }}"
              if ! az keyvault show --name "$VAULT_NAME" &>/dev/null; then
                DISCOVERED_KV=$(az keyvault list --resource-group "${{ parameters.aksResourceGroup }}" --query "[0].name" -o tsv 2>/dev/null || az keyvault list --query "[0].name" -o tsv 2>/dev/null || true)
                if [ -n "$DISCOVERED_KV" ]; then
                  echo "Discovered active Key Vault: $DISCOVERED_KV"
                  VAULT_NAME="$DISCOVERED_KV"
                fi
              fi
              echo "Retrieving scanner and cleanup credentials from Key Vault: ${VAULT_NAME}..."
              SP_CLIENT_ID=$(az keyvault secret show --vault-name "${VAULT_NAME}" --name AZURE-CLIENT-ID --query value -o tsv)
              SP_SECRET=$(az keyvault secret show --vault-name "${VAULT_NAME}" --name AZURE-CLIENT-SECRET --query value -o tsv)
              SP_TENANT=$(az keyvault secret show --vault-name "${VAULT_NAME}" --name AZURE-TENANT-ID --query value -o tsv)
              CLEANUP_CLIENT_ID=$(az keyvault secret show --vault-name "${VAULT_NAME}" --name CLEANUP-CLIENT-ID --query value -o tsv)
              CLEANUP_CLIENT_SECRET=$(az keyvault secret show --vault-name "${VAULT_NAME}" --name CLEANUP-CLIENT-SECRET --query value -o tsv)
              SENDGRID_KEY=$(az keyvault secret show --vault-name "${VAULT_NAME}" --name SENDGRID-API-KEY --query value -o tsv 2>/dev/null || echo "")

              kubectl create secret generic infrareaper-secrets -n "${{ parameters.kubeNamespace }}" \
                --from-literal=AZURE_CLIENT_ID="${SP_CLIENT_ID}" \
                --from-literal=AZURE_CLIENT_SECRET="${SP_SECRET}" \
                --from-literal=AZURE_TENANT_ID="${SP_TENANT}" \
                --from-literal=CLEANUP_CLIENT_ID="${CLEANUP_CLIENT_ID}" \
                --from-literal=CLEANUP_CLIENT_SECRET="${CLEANUP_CLIENT_SECRET}" \
                --from-literal=CLEANUP_TENANT_ID="${SP_TENANT}" \
                --from-literal=SENDGRID_API_KEY="${SENDGRID_KEY}" \
                --dry-run=client -o yaml | kubectl apply -f -
              echo "Secrets injected successfully into namespace ${{ parameters.kubeNamespace }}."
            displayName: "Synchronize Secrets from Key Vault"

          - script: |
              echo "=== Step 4: Deploy Observability Stack (Prometheus, Grafana, Loki) ==="
              kubectl apply -k "kubernetes/monitoring/"
            workingDirectory: ${{ parameters.workingDirectory }}
            displayName: "Deploy Observability Stack"

          - script: |
              echo "=== Step 5: Verify Cluster Resources ==="
              kubectl get all,cronjobs,networkpolicies,configmaps,secrets -n "${{ parameters.kubeNamespace }}"
            displayName: "Verify AKS Resources"
