apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: infrareaper

resources:
  - grafana-datasources.yaml
  - grafana-dashboards-provider.yaml
  - grafana-deployment.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: grafana-dashboards
    files:
      - dashboards/1-slo-dashboard.json
      - dashboards/2-compliance-dashboard.json
      - dashboards/3-inventory-dashboard.json
      - dashboards/4-lifecycle-dashboard.json
      - dashboards/5-cost-dashboard.json
      - dashboards/6-scanner-health.json
