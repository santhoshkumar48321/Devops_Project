apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: infrareaper
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: visualization
    app.kubernetes.io/part-of: infrareaper
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.infrareaper.svc.cluster.local:9090
        isDefault: true
        editable: false
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.infrareaper.svc.cluster.local:3100
        editable: false
