apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: infrareaper
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: visualization
    app.kubernetes.io/part-of: infrareaper
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: "InfraReaper Dashboards"
        orgId: 1
        folder: "InfraReaper"
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
