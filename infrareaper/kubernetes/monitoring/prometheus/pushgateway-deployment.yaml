apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-pushgateway
  namespace: infrareaper
  labels:
    app.kubernetes.io/name: prometheus-pushgateway
    app.kubernetes.io/component: metrics-gateway
    app.kubernetes.io/part-of: infrareaper
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus-pushgateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus-pushgateway
        app: prometheus-pushgateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pushgateway
          image: prom/pushgateway:v1.10.0
          imagePullPolicy: IfNotPresent
          args:
            - "--persistence.file=/tmp/metric.store"
            - "--persistence.interval=5m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: metrics
              containerPort: 9091
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9091
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9091
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: storage-volume
              mountPath: /tmp
      volumes:
        - name: storage-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-pushgateway
  namespace: infrareaper
  labels:
    app.kubernetes.io/name: prometheus-pushgateway
    app.kubernetes.io/component: metrics-gateway
    app.kubernetes.io/part-of: infrareaper
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus-pushgateway
  ports:
    - name: metrics
      port: 9091
      targetPort: 9091
      protocol: TCP
