apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap-policies.yaml
  - cronjob.yaml
  - networkpolicy.yaml

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: infrareaper-secrets
    namespace: infrareaper
    literals:
      - AZURE_CLIENT_ID=placeholder-scanner-client-id
      - AZURE_CLIENT_SECRET=placeholder-scanner-client-secret
      - AZURE_TENANT_ID=placeholder-azure-tenant-id
      - CLEANUP_CLIENT_ID=placeholder-cleanup-client-id
      - CLEANUP_CLIENT_SECRET=placeholder-cleanup-client-secret
      - CLEANUP_TENANT_ID=placeholder-azure-tenant-id
      - SENDGRID_API_KEY=""
