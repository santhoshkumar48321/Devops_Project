apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: infrareaper

resources:
  - ../../base

images:
  - name: infrareaperacrpalwa.azurecr.io/infrareaper-scanner
    newTag: dev

patches:
  - path: cronjob-patch.yaml
    target:
      kind: CronJob
      name: infrareaper-scanner

commonLabels:
  app.kubernetes.io/environment: dev
