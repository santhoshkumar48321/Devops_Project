apiVersion: batch/v1
kind: CronJob
metadata:
  name: infrareaper-scanner
spec:
  schedule: "*/30 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: scanner
              env:
                - name: DRY_RUN
                  value: "true"
                - name: ENVIRONMENT
                  value: "dev"
                - name: TARGET_RESOURCE_GROUPS
                  value: "infrareaper-test-resources"
                - name: NOTIFICATION_TO_EMAIL
                  value: "myselfgudboy@gmail.com"
                - name: NOTIFICATION_FROM_EMAIL
                  value: "myselfgudboy@gmail.com"
                - name: LOG_LEVEL
                  value: "DEBUG"
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
