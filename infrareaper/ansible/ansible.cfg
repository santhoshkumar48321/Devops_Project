# ============================================================
# InfraReaper — Ansible Configuration
# ============================================================
# This file tells Ansible HOW to behave.
# Ansible looks for ansible.cfg in this order:
#   1. ANSIBLE_CONFIG environment variable
#   2. ./ansible.cfg (current directory) ← WE USE THIS
#   3. ~/.ansible.cfg (home directory)
#   4. /etc/ansible/ansible.cfg (global)
#
# We place it in the ansible/ directory so it's picked up
# when you run playbooks from there.
# ============================================================

[defaults]
# --- Where is my inventory file? ---
# Without this, you'd have to type: ansible-playbook -i inventory/hosts.yml ...
# With this, Ansible always knows where to find your server list.
inventory = inventory/hosts.yml

# --- Which user runs the tasks on the target? ---
# This is YOUR username on the Ubuntu VM.
# Ansible connects as this user, then uses 'become' (sudo) for root tasks.
remote_user = santhosh

# --- Don't show warnings about deprecated features ---
deprecation_warnings = False

# --- Retry files clutter the directory. Disable them. ---
retry_files_enabled = False

# --- How many servers to configure in parallel ---
# We only have 1 server (localhost), so this doesn't matter yet.
# In a company with 50 servers, you'd set this to 10-20.
forks = 5

# --- Where to find roles ---
# Tells Ansible: "Look in the roles/ directory for role definitions."
roles_path = roles

# --- Use YAML format for stdout callback (easier to read) ---
# Default output is hard to read. YAML format shows what changed clearly.
stdout_callback = yaml

[privilege_escalation]
# --- Should Ansible use sudo by default? ---
# become = true means: "Run tasks as root unless told otherwise."
# This is needed because installing packages (apt), managing services,
# and configuring firewall all require root.
become = true

# --- How to become root ---
# 'sudo' is the standard way on Ubuntu.
become_method = sudo

# --- Which user to become ---
become_user = root

# --- Ask for sudo password? ---
# true = Ansible prompts you for your password each run (safer)
# false = requires passwordless sudo (less typing, but less secure)
# We set true for now. You'll type your sudo password once per playbook run.
become_ask_pass = true

[ssh_connection]
# --- SSH performance tuning ---
# Pipelining sends multiple commands over one SSH connection
# instead of opening a new connection for each task.
# Makes playbooks run ~2x faster.
# NOTE: Requires 'requiretty' to be disabled in sudoers (Ubuntu default is fine).
pipelining = True
