# ============================================================
# Role: security — Handlers
# ============================================================
# Handlers run only when config files are changed.
# ============================================================

---
- name: Restart SSH
  ansible.builtin.systemd:
    name: ssh
    state: restarted

- name: Restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted

- name: Reload UFW
  community.general.ufw:
    state: reloaded
