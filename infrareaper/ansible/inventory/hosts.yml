# ============================================================
# InfraReaper — Ansible Inventory
# ============================================================
# This file answers: "WHO is Ansible configuring?"
#
# INVENTORY CONCEPTS:
#
# 1. HOSTS — Individual servers (identified by IP or hostname)
# 2. GROUPS — Logical groupings of hosts (e.g., [webservers], [databases])
# 3. VARIABLES — Settings that apply to a host or group
#
# For InfraReaper, we only have ONE host: localhost (this server).
# In a real company, you'd have dozens of hosts in multiple groups.
#
# FORMAT: This is YAML inventory format (newer, more readable).
# You may also see INI format in older tutorials — both work.
# ============================================================

all:
  # 'all' is a built-in group that contains every host.
  # Every host belongs to 'all' automatically.

  hosts:
    localhost:
      # --- Connection type ---
      # 'local' means: don't SSH anywhere, run commands directly on this machine.
      # This is the key setting — without it, Ansible would try to SSH to 127.0.0.1,
      # which adds unnecessary overhead and requires SSH server to be running.
      ansible_connection: local

      # --- Python interpreter ---
      # Ansible needs Python on the target to run modules.
      # We explicitly point to python3 to avoid any python2 confusion.
      ansible_python_interpreter: /usr/bin/python3

  children:
    # 'children' defines sub-groups under 'all'.
    # We create a 'lab_servers' group with localhost in it.
    # This is good practice — if you ever add a second lab server,
    # you just add it to this group and the playbook applies to both.

    lab_servers:
      hosts:
        localhost:

# ============================================================
