# ============================================================
# InfraReaper CI/CD Multi-Stage Pipeline (Root Entrypoint)
# ============================================================
# Hardened, enterprise-grade multi-stage CI/CD pipeline executing
# on the self-hosted lab agent (infrareaper-lab-agent).
# ============================================================

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - infrareaper/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - infrareaper/**

pool:
  name: Default
  demands:
    - Agent.Name -equals infrareaper-lab-agent

variables:
  - name: ACR_NAME
    value: "infrareaperacrpalwa"
  - name: ACR_LOGIN_SERVER
    value: "infrareaperacrpalwa.azurecr.io"
  - name: IMAGE_REPOSITORY
    value: "infrareaper-scanner"
  - name: AKS_CLUSTER_NAME
    value: "infrareaper-aks"
  - name: AKS_RESOURCE_GROUP
    value: "infrareaper-core-rg"
  - name: KEYVAULT_NAME
    value: "infrareaperkv-k9r9y"
  - name: KUBE_NAMESPACE
    value: "infrareaper"
  - name: WORKING_DIR
    value: "$(Build.SourcesDirectory)/infrareaper"

stages:
  - template: infrareaper/pipelines/templates/lint-stage.yml
    parameters:
      workingDirectory: $(WORKING_DIR)

  - template: infrareaper/pipelines/templates/security-stage.yml
    parameters:
      workingDirectory: $(WORKING_DIR)

  - template: infrareaper/pipelines/templates/build-stage.yml
    parameters:
      workingDirectory: $(WORKING_DIR)
      acrName: $(ACR_NAME)
      acrLoginServer: $(ACR_LOGIN_SERVER)
      imageRepository: $(IMAGE_REPOSITORY)
      imageTag: $(Build.BuildId)

  - template: infrareaper/pipelines/templates/deploy-stage.yml
    parameters:
      workingDirectory: $(WORKING_DIR)
      aksClusterName: $(AKS_CLUSTER_NAME)
      aksResourceGroup: $(AKS_RESOURCE_GROUP)
      keyVaultName: $(KEYVAULT_NAME)
      kubeNamespace: $(KUBE_NAMESPACE)
      overlay: "dev"

  - template: infrareaper/pipelines/templates/smoke-test-stage.yml
    parameters:
      aksClusterName: $(AKS_CLUSTER_NAME)
      aksResourceGroup: $(AKS_RESOURCE_GROUP)
      kubeNamespace: $(KUBE_NAMESPACE)
      timeoutSeconds: 240

